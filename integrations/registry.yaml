# ============================================================
# AI FILM STUDIO - INTEGRATION REGISTRY
# ============================================================
#
# Catalogue of external capabilities the studio can call.
# Each entry is connected through an adapter; the core studio
# never imports an external repository directly.
#
# Fields
#   name            human-readable name
#   type            capability category (matches the key)
#   enabled         catalogue default; must ALSO be enabled in
#                   studio/config.yaml to run on a machine
#   execution_mode  local | external | hybrid
#   repository      upstream GitHub repo, or null until chosen
#   adapter         module path the orchestrator will load,
#                   or null until the adapter is written
#   heavy           true = needs significant CPU/GPU/RAM
#
# Repositories are intentionally null. Choose and pin them
# (with a commit or tag) when each adapter is implemented.
# ============================================================

integrations:

  stock:
    name: Stock media
    type: stock
    enabled: false
    execution_mode: external
    repository: null
    adapter: null
    heavy: false

  maps:
    name: Maps and geographic data
    type: maps
    enabled: false
    execution_mode: hybrid
    repository: null
    adapter: null
    heavy: false

  vectors:
    name: Vector graphics
    type: vectors
    enabled: false
    execution_mode: local
    repository: null
    adapter: null
    heavy: false

  tts:
    name: Text to speech
    type: tts
    enabled: false
    execution_mode: local
    repository: null
    adapter: null
    heavy: true

  transcription:
    name: Speech transcription
    type: transcription
    enabled: false
    execution_mode: local
    repository: null
    adapter: null
    heavy: true

  image_generation:
    name: AI image generation
    type: image_generation
    enabled: false
    execution_mode: external
    repository: null
    adapter: null
    heavy: true

  video_generation:
    name: AI video generation
    type: video_generation
    enabled: false
    execution_mode: external
    repository: null
    adapter: null
    heavy: true
