# ============================================================
# AI FILM STUDIO - INTEGRATION & MODEL REGISTRY
# ============================================================
#
# Every external tool (integrations:) and every model weight
# (models:) the studio may use, with its LICENSE STATE.
#
# The license gate (studio/legal/licenses.py) clears an entry
# ONLY when:
#   commercial_use is allowed   + verified: true + source set
#   commercial_use is conditional + verified + conditions written
#                                  + conditions_acknowledged: true
# prohibited / unknown / unverified -> BLOCKED. No exceptions.
#
# "verified: true" below means the license text was read at
# `source` on `verified_on`. Licenses change between versions:
# re-verify when you change `pin`. Entries marked verified: false
# are recorded from knowledge, NOT yet checked; verify them
# (python -m studio legal verify <key> ...) before use.
#
# Fields (integrations)
#   name, type, enabled, execution_mode (local|external|hybrid),
#   runs_on (laptop|gridshare|either), repository, pin, adapter,
#   heavy, license{...}
# Keep to simple YAML (nested mappings, scalars, [a, b] lists).
# ============================================================

integrations:

  # ---------------------------------------------- generation
